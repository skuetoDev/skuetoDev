# Guardar en: .github/workflows/metrics.yml (dentro del repo skuetoDev/skuetoDev)
name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"   # una vez al día
  workflow_dispatch:       # botón para lanzarlo a mano desde Actions

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats skuetoDev
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: skuetoDev
          filename: metrics/skuetoDev.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Madrid
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
